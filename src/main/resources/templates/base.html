
<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, content)">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${pageTitle} + ' | YoRHa Todo'">
        YoRHa Todo
    </title>

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          th:href="@{/vendor/css/bootstrap.min.css}">

    <!-- CSS du projet -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Contenu de la page -->
<main th:replace="${content}">
    Contenu de la page
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS -->
<script th:src="@{/vendor/js/bootstrap.bundle.min.js}"></script>

<!-- JavaScript du projet -->
<script th:src="@{/js/app.js}"></script>

</body>
</html>
