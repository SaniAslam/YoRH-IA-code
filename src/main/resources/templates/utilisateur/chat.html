
<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Assistant IA', ~{::main})}">

<body>

<main class="chat-page container-fluid py-4">

    <!-- HISTORIQUE DES CONVERSATIONS -->
    <!-- HISTORIQUE DES CONVERSATIONS -->
    <aside class="conversation-sidebar">

        <h3>HISTORIQUE</h3>

        <!-- Bouton nouveau chat -->
        <a th:href="@{/chat}" class="btn btn-yorha new-chat-button">
            + NOUVEAU CHAT
        </a>

        <!-- Liste des conversations -->
        <div th:each="conv : ${conversations}"
             class="conversation-item">

            <a th:href="@{/conversations/{id}(id=${conv.id})}"
               class="conversation-link"
               th:classappend="${conversation != null and conversation.id == conv.id} ? ' active' : ''"
               th:text="${conv.titre}">
            </a>

            <!-- Bouton supprimer -->
            <form th:action="@{/conversations/{id}/supprimer(id=${conv.id})}"
                  method="post"
                  class="conversation-delete-form"
                  onsubmit="return confirm('Supprimer définitivement cette conversation et tous ses messages ?');">

                <button type="submit"
                        class="conversation-delete-button"
                        title="Supprimer la conversation">
                    x
                </button>

            </form>

        </div>

    </aside>

    <!-- ZONE PRINCIPALE -->
    <div class="row">

        <div class="col-12">

            <div class="yorha-panel p-4">

                <!-- EN-TÊTE -->
                <div class="text-center mb-4">

                    <h1 class="hero-title">
                        YORHA AI SYSTEM
                    </h1>

                    <p class="hero-subtitle">
                        PERSONAL INTELLIGENCE ASSISTANT
                    </p>

                    <div class="decorative-line"></div>

                </div>

                <!-- MESSAGE D'ACCUEIL -->
                <div th:if="${conversation == null}"
                     class="text-center py-5">

                    <h2>Comment puis-je vous aider ?</h2>

                    <p class="text-muted">
                        Sélectionnez un modèle IA et posez votre question.
                    </p>

                </div>

                <!-- HISTORIQUE DES MESSAGES -->
                <section id="chat-messages"
                         class="chat-messages mb-4">

                    <div th:each="message : ${messages}"
                         class="message-item"
                         th:classappend="${message.typeMessage == T(org.ldv.chat.model.entity.TypeMessage).UTILISATEUR} ? ' message-item-user' : ' message-item-assistant'">

                        <div class="message-bubble">

                            <!-- MESSAGE UTILISATEUR -->
                            <div th:if="${message.typeMessage == T(org.ldv.chat.model.entity.TypeMessage).UTILISATEUR}">

                                <div class="message-author">
                                    <strong>USER</strong>
                                </div>

                                <div class="message-content user-message"
                                     th:text="${message.contenu}">
                                </div>

                            </div>

                            <!-- MESSAGE ASSISTANT -->
                            <div th:if="${message.typeMessage == T(org.ldv.chat.model.entity.TypeMessage).ASSISTANT}">

                                <div class="message-author">
                                    <strong>YoRH-IA</strong>
                                </div>

                                <div class="message-content bot-message"
                                     th:text="${message.contenu}">
                                </div>

                            </div>

                        </div>

                    </div>

                </section>

                <!-- FORMULAIRE NOUVELLE CONVERSATION -->
                <div th:if="${conversation == null}"
                     class="chat-form-area border-top pt-4">

                    <form th:action="@{/conversations}"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                MODÈLE D'INTELLIGENCE ARTIFICIELLE
                            </label>

                            <select name="idModele"
                                    class="form-select"
                                    required>

                                <option value=""
                                        disabled
                                        selected>
                                    Choisir un modèle IA
                                </option>

                                <option th:each="modele : ${modeles}"
                                        th:value="${modele.id}"
                                        th:text="${modele.nom}">
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                VOTRE MESSAGE
                            </label>

                            <textarea name="prompt"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Écrivez votre question..."
                                      required></textarea>

                        </div>

                        <button type="submit"
                                class="btn btn-yorha w-100">

                            ENVOYER LA COMMANDE

                        </button>

                    </form>

                </div>

                <!-- FORMULAIRE CONVERSATION EXISTANTE -->
                <div th:if="${conversation != null}"
                     class="chat-form-area border-top pt-4">

                    <div class="selected-model mb-3 d-flex align-items-center gap-2">

                        <img th:src="${#strings.toLowerCase(conversation.modeleIA.fourniseurIA.nom) == 'mistral'}
                    ? @{/img/mistral.png}
                    : @{/img/gemini.png}"
                             th:alt="${conversation.modeleIA.fourniseurIA.nom}"
                             width="32"
                             height="32">

                        <strong th:text="${conversation.modeleIA.nom}">
                            Modèle IA
                        </strong>

                    </div>

                    <!-- ENVOI MESSAGE -->
                    <form th:action="@{/conversations/{id}/messages(id=${conversation.id})}"
                          method="post">

                        <div class="mb-3">

                            <textarea name="prompt"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Écrivez votre message..."
                                      required></textarea>

                        </div>

                        <button type="submit"
                                class="btn btn-yorha w-100">

                            ENVOYER LE MESSAGE

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

</body>
</html>
