
<header th:fragment="header" class="yorha-header">

    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand yorha-brand" th:href="@{/}">
                <span class="yorha-symbol">Y</span>
                PROJECT YoRHa
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent"
                    aria-controls="navbarContent"
                    aria-expanded="false"
                    aria-label="Ouvrir le menu">

                <span class="navbar-toggler-icon"></span>
                <!-- Nouvelle conversation -->
                <a th:href="@{/}" class="btn btn-outline-light w-100 mb-4">
                    + Nouvelle conversation
                </a>

                <h6 class="text-secondary">Historique</h6>
                <div class="list-group">
                    <a th:each="c : ${conversations}"
                       th:href="@{/conversations/{id}(id=${c.id})}"
                       th:text="${c.titre}"
                       class="list-group-item list-group-item-action"
                       th:classappend="${conversation != null and conversation.id == c.id} ? 'active' : ''">
                    </a>

            <div class="collapse navbar-collapse"
                 id="navbarContent">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            ACCUEIL
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/connexion}">
                            CONNEXION
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

</header>
